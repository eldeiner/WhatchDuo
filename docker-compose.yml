# CineDúo — despliegue local/producción sencilla con SQLite persistente.
# Uso: cp .env.example .env && docker compose up --build
services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: file:/data/cineduo.db
      TOKEN_SECRET: ${TOKEN_SECRET:?Define TOKEN_SECRET en .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOST_DISCONNECT_GRACE_MS: ${HOST_DISCONNECT_GRACE_MS:-30000}
      MAX_PARTICIPANTS: ${MAX_PARTICIPANTS:-4}
    volumes:
      - cineduo-data:/data
    ports:
      - '4000:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '3000:3000'

volumes:
  cineduo-data:
